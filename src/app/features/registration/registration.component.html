<div class="min-vh-100 bg-light d-flex flex-column align-items-center justify-content-center p-4">

  <div *ngIf="registeredUsername(); else formView" class="card shadow-sm text-center p-4" style="width: 100%; max-width: 520px;">
    <div class="d-flex align-items-center justify-content-center rounded-circle bg-success bg-opacity-25 mx-auto mb-3"
         style="width: 56px; height: 56px; font-size: 1.5rem;">
      <span class="text-success fw-bold">✓</span>
    </div>
    <h2 class="h5 fw-bold mb-1">Account Created</h2>
    <p class="text-muted small mb-0">
      Welcome, <strong>{{ registeredUsername() }}</strong>! Your account is ready.
    </p>
  </div>

  <ng-template #formView>
    <div class="card shadow-sm p-4" style="width: 100%; max-width: 520px;">
      <h1 class="h4 fw-bold mb-1">Create Account</h1>
      <p class="text-muted small mb-4">Fill in your details to get started.</p>

      <!-- reusing the username availability component in embedded mode -->
      <app-user-availability
        [embedded]="true"
        (usernameRegistered)="onUsernameRegistered($event)">
      </app-user-availability>
    </div>
  </ng-template>

</div>
